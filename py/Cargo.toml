[package]
name = "rustymath-py"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false

[features]
default = ["native"]
native = ["rustymath/native"]

[dependencies]
rustymath = { path = "..", default-features = false }
rustymath-buffer = { path = "../buffer" }
pyo3 = { version = ">=0.29", features = ["extension-module", "num-bigint"] }
num-bigint = ">=0.4.6, <0.5"
num-rational = ">=0.4.2, <1"
num-traits = ">=0.2.19, <1"
rand = { version = ">=0.10.2, <1", default-features = false, features = ["std_rng", "sys_rng"] }

[build-dependencies]
pyo3-build-config = ">=0.29"
