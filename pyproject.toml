[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rustymath"
dynamic = ["version"]
description = "Fast maths functions for f16, f32 and f64 in plain Rust."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["fastship>=0.0.11", "maturin>=1.0,<2.0", "pytest", "nbdev", "scipy"]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/rustymath"
Repository = "https://github.com/AnswerDotAI/rustymath"
Issues = "https://github.com/AnswerDotAI/rustymath/issues"
Documentation = "https://answerdotai.github.io/rustymath"

[tool.fastship]
branch = "main"

[tool.maturin]
manifest-path = "py/Cargo.toml"
python-source = "python"
module-name = "rustymath._core"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "py/Cargo.toml" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.nbdev]
lib_path = "python/rustymath"
put_version_in_init = false
