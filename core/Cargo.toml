[package]
name = "rustymath-core"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
license = "Apache-2.0"
description = "Numerical algorithms, formulas and compact array storage."
repository = "https://github.com/AnswerDotAI/rustymath"

[lib]
test = false
doctest = false

[features]
default = ["native"]
native = []

[dependencies]
half.workspace = true
hashbrown.workspace = true
foldhash.workspace = true
num-bigint.workspace = true
num-complex.workspace = true
num-integer.workspace = true
num-rational.workspace = true
num-traits.workspace = true
rand.workspace = true
strength_reduce.workspace = true

# The browser executes its parallel pieces on the calling thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

