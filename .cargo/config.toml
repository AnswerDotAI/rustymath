# Cargo joins the rustflags of every matching `target` entry. `cfg(all())` matches every target.
[target.'cfg(all())']
rustflags = ["-Zshare-generics=yes"]

# x86-64 builds need a CPU with AVX2 (x86-64-v3). The kernels rely on its rounding and wider vector instructions.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

[env]
RUSTC_BOOTSTRAP = "1"
