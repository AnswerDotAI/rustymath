[workspace]
members = ["py"]
default-members = [".", "py"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[package]
name = "rustymath"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
license = "Apache-2.0"
description = "Fast maths functions for f16, f32 and f64 in plain Rust."
repository = "https://github.com/AnswerDotAI/rustymath"

[lib]
name = "rustymath"

[dependencies]
half = { version = ">=2.7.1, <3", features = ["num-traits"] }
num-bigint = ">=0.4.6, <0.5"
num-complex = ">=0.4.6, <1"
num-rational = ">=0.4.2, <1"
num-traits = ">=0.2.19, <1"

[dev-dependencies]
# Correctly rounded references for the accuracy tests.
pxfm = ">=0.1.30, <1"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.rustymath]
incremental = true

[profile.release.package.rustymath-py]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.rustymath]
incremental = false

[profile.dist.package.rustymath-py]
incremental = false
