[workspace]
members = ["buffer", "py"]
default-members = [".", "buffer", "py"]

[workspace.package]
version = "0.1.53"
edition = "2024"

[workspace.dependencies]
rustymath = { path = ".", version = ">=0.1.39, <1", default-features = false }
rustymath-buffer = { path = "buffer", version = ">=0.1.39, <1" }
pyo3 = ">=0.29"
pyo3-build-config = ">=0.29"

[workspace.metadata.fastfmt]
join_comments = true

[package]
name = "rustymath"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
license = "Apache-2.0"
description = "Maths in plain Rust, from fast f16, f32 and f64 functions to exact rationals."
repository = "https://github.com/AnswerDotAI/rustymath"

[lib]
name = "rustymath"
test = false

[features]
default = ["native"]
# Compiles rustymath's own linear algebra into macOS builds too, beside Accelerate, so `RUSTYMATH_NATIVE=1` can select it at run time.
# Other targets always compile it. The Mac release builds turn it off with `--no-default-features`.
native = []

[dependencies]
half = { version = ">=2.7.1, <3", features = ["num-traits"] }
hashbrown = ">=0.15, <1"
foldhash = ">=0.2.0, <1"
num-bigint = ">=0.4.6, <0.5"
num-complex = ">=0.4.6, <1"
num-integer = ">=0.1.46, <1"
num-rational = ">=0.4.2, <1"
num-traits = ">=0.2.19, <1"
rand = { version = ">=0.10.2, <1", default-features = false, features = ["alloc"] }
strength_reduce = ">=0.2.4, <1"

# The browser build has no threads. There `parallel` runs its pieces in turn on the calling thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = ">=1.12.0, <2"

# The browser's clock, for the timing loop in `timing`, as basedpl's browser build uses it.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = ">=1.1.0, <2"

[target.'cfg(unix)'.dependencies]
# The memory guard reads physical memory through `libc`. On macOS, the timing lock also makes its QoS call through it, to favour the performance cores for a timing.
libc = ">=0.2.190, <1"

[profile.test]
inherits = "release"

[profile.release]
opt-level = 2
# Thin LTO across the crate's own codegen units, Cargo's default. Incremental builds put `#[inline]` helpers such as iterator adapters in codegen units of their own, where only LTO can inline them.
lto = false
overflow-checks = false
debug-assertions = false
incremental = true
# Line tables change with every shifted line and recompile the code below it.
debug = false

[profile.dist]
inherits = "release"
incremental = false
strip = true

# A local run before each release (`cargo test --profile checked`): debug assertions add the standard library's checks in unsafe code, which cost basedpl 12 to 55% per call.
[profile.checked]
inherits = "test"
debug-assertions = true
