name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every test step after the first runs even when an earlier step fails, to report every test's result in one run.
jobs:
  test:
    runs-on: ubicloud-standard-4-ubuntu-2604
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      # The repository has no `Cargo.lock`. Creating one first makes rust-cache's key change when a dependency publishes a new version.
      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: cargo develop
      - run: cargo nextest run --cargo-profile release -E 'not binary(speed)'
      - run: pytest -q --ignore=tests/test_speed.py
        if: ${{ !cancelled() }}
      - run: nbdev-test
        if: ${{ !cancelled() }}
