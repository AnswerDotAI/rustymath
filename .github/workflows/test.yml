name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every test step after the first runs even when an earlier step fails, to report every test's result in one run.
jobs:
  test:
    runs-on: ubicloud-standard-4-ubuntu-2604
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: AnswerDotAI/.github/actions/sccache@main
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: AnswerDotAI/.github/actions/setup-uv@main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: uv pip install --system --config-settings-package rustymath:metadata-only=1 -e '.[test]'
      - run: cargo develop
      - run: cargo nextest run --cargo-profile release -E 'not binary(speed)'
      - run: pytest -q --ignore=tests/test_speed.py
        if: ${{ !cancelled() }}
      - run: nbdev-test
        if: ${{ !cancelled() }}
